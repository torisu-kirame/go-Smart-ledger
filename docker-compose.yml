# Smart Ledger — 一键启动（先 make build-linux，再 docker compose build）
#
#   make up
#   make docker-build && docker compose up -d
#
# 控制台: http://localhost:25173  (web 容器 Nginx)
# 网关:   http://localhost:28080  (直连 API / 调试)
# 链浏览器: http://localhost:24441/dashboard
# 默认账号: admin / admin123

name: smart-ledger

services:
  miniledger:
    image: node:22-alpine
    container_name: smart-ledger-miniledger
    working_dir: /app
    volumes:
      - ./backend/infra/miniledger:/app
      - miniledger-data:/app/data
    entrypoint: ["/bin/sh", "/app/docker-entrypoint.sh"]
    ports:
      - "24441:24441"
      - "24440:24440"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:24441/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  auth-api:
    build:
      context: ./backend
      dockerfile: deploy/Dockerfile.auth
    container_name: smart-ledger-auth-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - auth-avatars:/data/avatars
    ports:
      - "28887:28887"
    healthcheck:
      # wget --spider 使用 HEAD，go-zero 仅注册 GET 会返回 405
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:28887/api/v1/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  ipfs:
    image: ipfs/kubo:v0.32.1
    container_name: smart-ledger-ipfs
    environment:
      IPFS_PROFILE: server
    ports:
      - "25001:5001"
      - "28090:8080"
    volumes:
      - ipfs-data:/data/ipfs
    healthcheck:
      test: ["CMD-SHELL", "ipfs id >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  ledger-api:
    build:
      context: ./backend
      dockerfile: deploy/Dockerfile.ledger
    container_name: smart-ledger-ledger-api
    ports:
      - "28888:28888"
    depends_on:
      miniledger:
        condition: service_healthy
      ipfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:28888/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  storage-api:
    build:
      context: ./backend
      dockerfile: deploy/Dockerfile.storage
    container_name: smart-ledger-storage-api
    ports:
      - "28890:28890"
    volumes:
      - storage-backups:/data/backups
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:28890/api/v1/storage/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  gateway-api:
    build:
      context: ./backend
      dockerfile: deploy/Dockerfile.gateway
    container_name: smart-ledger-gateway
    ports:
      - "28080:28080"
    depends_on:
      auth-api:
        condition: service_healthy
      ledger-api:
        condition: service_healthy
      storage-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:28080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./frontend/desktop
      dockerfile: Dockerfile
    container_name: smart-ledger-web
    ports:
      - "25173:80"
    depends_on:
      gateway-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  auth-avatars:
  miniledger-data:
  storage-backups:
  ipfs-data:
