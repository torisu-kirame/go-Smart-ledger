Name: auth-api
Host: 0.0.0.0
Port: 28887

Auth:
  AccessSecret: smart-ledger-access-secret-change-me
  RefreshSecret: smart-ledger-refresh-secret-change-me
  AccessExpire: 900
  RefreshExpire: 604800
  CookieSecure: false

# 使用 Compose 内 mysql 服务；若要用本机 3306，改为 host.docker.internal:3306 并去掉 auth 对 mysql 的 depends_on
MySQL:
  DataSource: root:123456@tcp(mysql:3306)/smart_ledger?parseTime=true&charset=utf8mb4&loc=Local

Users:
  - username: admin
    password: admin123

Log:
  Mode: console
  Level: info
