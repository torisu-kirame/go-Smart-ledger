Name: ledger-api
Host: 0.0.0.0
Port: 28888
Timeout: 600000

# FISCO BCOS 为权威顶层链（见 docs/fisco-bcos-migration.md）
Chain:
  Backend: fisco
  FISCO:
    JSONRPCURL: http://host.docker.internal:8545
    GroupID: 1
    ChainID: 1
    RegistryContract: ""   # 部署 LedgerRegistry.sol 后填写
    ExplorerURL: http://127.0.0.1:25002

# legacy：MiniLedger profile 仍可使用
MiniLedger:
  BaseURL: http://miniledger:24441

TxQueue:
  Enabled: true
  PersistPath: /data/txqueue.json
  MaxAttempts: 30

NSQ:
  NsqdAddr: nsqd:4150
  LookupdHTTP:
    - http://nsqlookupd:4161
  Topic: chain_tx_retry
  Channel: ledger-worker
  MaxInFlight: 4

Discovery:
  Etcd:
    Enabled: false
  Grpc:
    Enabled: true
    Port: 28898
  RegisterHTTP: http://ledger-api:28888
  RegisterGRPC: ledger-api:28898

BackupDir: /data/backups

HDWallet:
  Mnemonic: "test test test test test test test test test test test junk"

Snowflake:
  NodeID: 2

IPFS:
  ApiURL: http://ipfs:5001
  Enabled: false

ExternalAnchor:
  Enabled: false

Log:
  Mode: console
  Level: info
