Name: ledger-api
Host: 0.0.0.0
Port: 28888
# OpenClaw 流式对话首条回复可能较慢，需放宽 HTTP 超时（毫秒）
Timeout: 600000

# FISCO BCOS 3.0 为默认权威链（v0.18+）；MiniLedger 见 profile legacy + docker-compose.legacy.yml
Chain:
  Backend: fisco
  FISCO:
    JSONRPCURL: http://host.docker.internal:20200
    GroupID: group0
    ChainID: chain0
    DisableSsl: true
    RegistryContract: ""
    PrivateKeyHex: ""
    ExplorerURL: http://127.0.0.1:25002

# legacy profile：MiniLedger 容器仍可用
MiniLedger:
  BaseURL: http://miniledger:24441

TxQueue:
  Enabled: true
  PersistPath: /data/txqueue.json
  MaxAttempts: 30

NSQ:
  NsqdAddr: nsqd:4150
  LookupdHTTP:
    - http://nsqlookupd:4161
  Topic: chain_tx_retry
  Channel: ledger-worker
  MaxInFlight: 4

Discovery:
  Etcd:
    Enabled: false
    Hosts:
      - etcd:2379
    KeyPrefix: /smart-ledger/services
  Grpc:
    Enabled: true
    Port: 28898
  RegisterHTTP: http://ledger-api:28888
  RegisterGRPC: ledger-api:28898

BackupDir: /data/backups

HDWallet:
  Mnemonic: "test test test test test test test test test test test junk"

Snowflake:
  NodeID: 2

IPFS:
  ApiURL: http://ipfs:5001
  Enabled: false

# F29: set Enabled true + contract after deploying LedgerAnchor (see docs/evm-anchor.md)
ExternalAnchor:
  Enabled: false
  RPCURL: http://anvil:8545
  ChainID: 31337
  ChainName: anvil
  Contract: ""
  ExplorerURLTemplate: ""

Log:
  Mode: console
  Level: info
