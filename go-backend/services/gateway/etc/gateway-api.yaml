Name: gateway-api
Host: 0.0.0.0
Port: 28080
Timeout: 600000

Auth:
  AccessSecret: smart-ledger-access-secret-change-me

Upstreams:
  Auth: http://127.0.0.1:28887
  Ledger: http://127.0.0.1:28888
  Storage: http://127.0.0.1:28890

OpenClaw:
  GatewayURL: http://127.0.0.1:18789
  GatewayToken: ""
  AgentModel: openclaw/default

Agent:
  ConfigPath: ../../data/agent/config

Cors:
  AllowedOrigins:
    - http://localhost:25173
    - http://127.0.0.1:25173

Security:
  TrustForwardedProto: true
  RateLimit:
    Enabled: true
    GlobalRPM: 600
    Burst: 80
    AuthRPM: 30
    AuthBurst: 10

Log:
  Mode: console
  Level: info
