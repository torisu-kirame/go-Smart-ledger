Name: gateway-api
Host: 0.0.0.0
Port: 28080
Timeout: 600000

Auth:
  AccessSecret: smart-ledger-access-secret-change-me

Upstreams:
  Auth: http://auth-api:28887
  Ledger: http://ledger-api:28888
  Storage: http://storage-api:28890
  Ai: http://ai-api:28891

Discovery:
  Etcd:
    Enabled: true
    Hosts:
      - etcd:2379
    KeyPrefix: /smart-ledger/services

Cors:
  AllowedOrigins:
    - http://localhost:25173
    - http://127.0.0.1:25173

Log:
  Mode: console
  Level: info
