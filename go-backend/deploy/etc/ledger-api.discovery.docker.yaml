Name: ledger-api
Host: 0.0.0.0
Port: 28888
Timeout: 600000

MiniLedger:
  BaseURL: http://miniledger:24441

TxQueue:
  Enabled: true
  PersistPath: /data/txqueue.json
  MaxAttempts: 30

NSQ:
  NsqdAddr: nsqd:4150
  LookupdHTTP:
    - http://nsqlookupd:4161
  Topic: chain_tx_retry
  Channel: ledger-worker
  MaxInFlight: 4

Discovery:
  Etcd:
    Enabled: true
    Hosts:
      - etcd:2379
    KeyPrefix: /smart-ledger/services
  Grpc:
    Enabled: true
    Port: 28898
  RegisterHTTP: http://ledger-api:28888
  RegisterGRPC: ledger-api:28898

BackupDir: /data/backups

HDWallet:
  Mnemonic: "test test test test test test test test test test test junk"

Snowflake:
  NodeID: 2

IPFS:
  ApiURL: http://ipfs:5001
  Enabled: false

Log:
  Mode: console
  Level: info
