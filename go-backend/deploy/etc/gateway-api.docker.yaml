Name: gateway-api
Host: 0.0.0.0
Port: 28080
# 代理 AI 流式对话时需保持长连接
Timeout: 600000

Auth:
  AccessSecret: smart-ledger-access-secret-change-me

Upstreams:
  Auth: http://auth-api:28887
  Ledger: http://ledger-api:28888
  Storage: http://storage-api:28890
  Ai: http://ai-api:28891

Cors:
  AllowedOrigins:
    - http://localhost:25173
    - http://127.0.0.1:25173
    - https://localhost:25174

Security:
  TrustForwardedProto: true
  RateLimit:
    Enabled: true
    GlobalRPM: 600
    Burst: 80
    AuthRPM: 30
    AuthBurst: 10

Log:
  Mode: console
  Level: info
