# Optional local EVM for F29 external anchor testing.
#   docker compose -f docker-compose.yml -f docker-compose.evm.yml up -d anvil

name: smart-ledger

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: smart-ledger-anvil
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545"]
    ports:
      - "8545:8545"
    restart: unless-stopped
