server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://gateway-api:28080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI 流式对话：禁用缓冲，延长读超时
    location /api/v1/ai/ {
        proxy_pass http://gateway-api:28080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # MiniLedger 官方浏览器（静态页使用绝对路径 /dashboard/*，API 为 /status、/blocks 等）
    location /dashboard/ {
        proxy_pass http://miniledger:24441/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host miniledger:24441;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /dashboard {
        return 302 /dashboard/;
    }

    location ~ ^/(status|blocks|tx|state|peers|consensus|search|contracts|proposals|identity)(/|$) {
        proxy_pass http://miniledger:24441;
        proxy_http_version 1.1;
        proxy_set_header Host miniledger:24441;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 中文版区块浏览器（构建时由 public/explorer-zh 打入 dist）
    location /explorer-zh/ {
        try_files $uri $uri/ /explorer-zh/index.html;
    }

    location = /explorer-zh {
        return 302 /explorer-zh/;
    }

    # 兼容旧链接
    location /miniledger/ {
        return 302 /dashboard/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
