# Smart Ledger Java Backend — 一键启动
#
# 在 java-backend 目录：
#   docker compose up -d --build
#
# Compose 项目: smart-ledger-java（容器名 smart-ledger-java-*）
#
# 控制台: http://localhost:25173
# 网关:   http://localhost:28080
# 默认账号: admin / admin123
# 离线 Ollama: docker compose --profile offline-ai up -d

name: smart-ledger-java

services:
  miniledger:
    image: node:22-alpine
    container_name: smart-ledger-java-miniledger
    working_dir: /app
    volumes:
      - ../go-backend/infra/miniledger:/app
      - miniledger-data:/app/data
    entrypoint: ["/bin/sh", "/app/docker-entrypoint.sh"]
    ports:
      - "24441:24441"
      - "24440:24440"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:24441/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  auth-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.auth
    image: smart-ledger-java-auth-api:latest
    container_name: smart-ledger-java-auth-api
    environment:
      SMARTLEDGER_BACKEND: java
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - auth-avatars:/data/avatars
    ports:
      - "28887:28887"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:28887/api/v1/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  ledger-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ledger
    image: smart-ledger-java-ledger-api:latest
    container_name: smart-ledger-java-ledger-api
    environment:
      SMARTLEDGER_BACKEND: java
      SL_CHAIN_BACKEND: miniledger
    ports:
      - "28888:28888"
    depends_on:
      miniledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:28888/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  storage-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.storage
    image: smart-ledger-java-storage-api:latest
    container_name: smart-ledger-java-storage-api
    environment:
      SMARTLEDGER_BACKEND: java
    ports:
      - "28890:28890"
    volumes:
      - storage-backups:/data/backups
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:28890/api/v1/storage/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  ai-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
    image: smart-ledger-java-ai-api:latest
    container_name: smart-ledger-java-ai-api
    environment:
      SMARTLEDGER_BACKEND: java
      AGENT_CONFIG_PATH: /data/agent/config
      LEDGER_API_URL: http://ledger-api:28888
    volumes:
      - ../deploy/config/agent:/data/agent/config
    ports:
      - "28891:28891"
    depends_on:
      ledger-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:28891/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  gateway-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    image: smart-ledger-java-gateway-api:latest
    container_name: smart-ledger-java-gateway
    environment:
      SMARTLEDGER_BACKEND: java
    ports:
      - "28080:28080"
    depends_on:
      auth-api:
        condition: service_healthy
      ledger-api:
        condition: service_healthy
      storage-api:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:28080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ../frontend/desktop
      dockerfile: Dockerfile
    image: smart-ledger-java-web:latest
    container_name: smart-ledger-java-web
    ports:
      - "25173:80"
    depends_on:
      gateway-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  ollama:
    profiles: ["offline-ai"]
    image: ollama/ollama:latest
    container_name: smart-ledger-java-ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  ollama-init:
    profiles: ["offline-ai"]
    image: ollama/ollama:latest
    container_name: smart-ledger-java-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling chat model: $$OLLAMA_CHAT_MODEL"
        ollama pull "$$OLLAMA_CHAT_MODEL" || echo "warn: chat model pull failed"
        echo "Ollama models ready"
    restart: "no"

volumes:
  auth-avatars:
    name: smart-ledger-auth-avatars
  miniledger-data:
    name: smart-ledger-miniledger-data
  storage-backups:
    name: smart-ledger-storage-backups
  ollama-models:
    name: smart-ledger-ollama-models
