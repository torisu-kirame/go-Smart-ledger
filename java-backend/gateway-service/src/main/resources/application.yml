server:
  port: 28080

spring:
  application:
    name: gateway-api
  cloud:
    gateway:
      httpclient:
        response-timeout: 600s
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:25173
              - http://127.0.0.1:25173
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

smartledger:
  jwt:
    access-secret: smart-ledger-access-secret-change-me
    refresh-secret: smart-ledger-refresh-secret-change-me
    access-expire-seconds: 900
    refresh-expire-seconds: 604800
    cookie-secure: false
  upstreams:
    auth: http://auth-api:28887
    ledger: http://ledger-api:28888
    storage: http://storage-api:28890

logging:
  level:
    root: info
