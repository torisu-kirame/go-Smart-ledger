# FISCO BCOS 3.x — Compose overlay（内置 fisco-node 容器）
#
# 启动 FISCO 链 + ledger-api（FISCO 后端，经 .env.fisco 切换链后端）：
#   docker compose -f docker-compose.yml -f docker-compose.fisco.yml --profile fisco up -d
# 或：make fisco-up
#
# 仅启动链节点：
#   docker compose -f docker-compose.yml -f docker-compose.fisco.yml --profile fisco up -d fisco-node
#
# RPC: http://localhost:20200  （容器内 ledger-api → http://fisco-node:20200）

name: smart-ledger

services:
  fisco-node:
    build:
      context: ./go-backend/infra/fisco
      dockerfile: Dockerfile
    image: smart-ledger/fisco-node:3.6.0
    container_name: smart-ledger-fisco-node
    profiles: [fisco]
    ports:
      - "20200:20200"
      - "30300:30300"
    volumes:
      - fisco-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sf",
          "-X",
          "POST",
          "http://127.0.0.1:20200",
          "-H",
          "Content-Type: application/json",
          "-d",
          '{"jsonrpc":"2.0","method":"getBlockNumber","params":[],"id":1}',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s
    restart: unless-stopped

  # FISCO 模式停用 miniledger（ledger-api 链配置见主 compose + .env.fisco，避免重复声明 ledger-api 服务键）
  miniledger:
    profiles: !override
      - miniledger-standalone

  ledger-api:
    depends_on:
      fisco-node:
        condition: service_healthy
